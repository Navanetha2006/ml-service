name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python train.py
      - run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ml-service:ci .

      - name: Run container and verify (release check)
        run: |
          docker run -d -p 8000:8000 --name svc ml-service:ci
          sleep 8
          curl --fail http://localhost:8000/health
          curl --fail -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"mean_radius":14.1,"mean_texture":19.3,"mean_perimeter":92,"mean_area":654,"mean_smoothness":0.096}'
          curl --fail http://localhost:8000/ > /dev/null

      - name: Push image on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker tag ml-service:ci ${IMAGE,,}
          docker push ${IMAGE,,}
